name: termeh
description: Termeh is a modern open-source SSH client for managing servers
  and terminal sessions.
publish_to: 'none'
version: 1.1.0
homepage: https://github.com/vantinent/termeh
repository: https://github.com/vantinent/termeh

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.17.1
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.5+1
  xterm: ^4.0.0
  uuid: ^4.5.3
  window_manager: ^0.5.1
  google_fonts: ^8.1.0
  crypto: ^3.0.7
  lucide_icons_flutter: ^3.1.13
  file_selector: ^1.1.0
  flutter_svg: ^2.2.4
  cryptography: ^2.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  linux:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
