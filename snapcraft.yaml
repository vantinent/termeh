name: termeh
title: Termeh
version: '1.1.0'
summary: Termeh is a modern open-source SSH client for managing servers and
  terminal sessions.

description: |
  Termeh is a modern desktop SSH client built for managing servers and terminal sessions with
  a clean and efficient experience. It provides a fast, lightweight, and distraction-free
  environment for developers, system administrators, and power users.
  
  Your privacy and security are a core part of Termeh’s design. 
  All data is stored securely on your local machine, and the application does not rely on 
  any services for syncing, analytics, or data processing. 
  Your server credentials and session data remain under your control.
  
  Termeh is also fully open source, allowing anyone to inspect the codebase, 
  contribute improvements, and verify how the application works. 
  The project focuses on transparency, simplicity, and giving
  users complete ownership over their workflow and data.

contact: https://github.com/vantinent/termeh/issues
license: MIT
website: https://github.com/vantinent/termeh
source-code: https://github.com/vantinent/termeh
issues: https://github.com/vantinent/termeh/issues
donation: https://github.com/sponsors/vantinent

base: core22
confinement: strict
grade: stable

apps:
  termeh:
    command: termeh
    extensions: [gnome]
    plugs:
      - network

parts:
  termeh:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang-14
      - lld-14
      - llvm-14
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - libsecret-1-dev
    override-pull: |
      craftctl default
      rm -rf build .dart_tool
      rm -rf .flutter-plugins .flutter-plugins-dependencies
      rm -rf linux/flutter/ephemeral
